# ============================
# Student Management REST API
# ============================
spring.application.name=student-management
server.port=8080

# ---- MySQL (override with environment variables, see README) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# update: create the table if missing, alter it on entity changes.
# Use 'validate' or 'none' in production — never 'create-drop'.
spring.jpa.hibernate.ddl-auto=update
# No lazy loading outside transactions — REST responses are fully built in the service layer.
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Jackson ----
spring.jackson.serialization.indent-output=true
